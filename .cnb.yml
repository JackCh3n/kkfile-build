# =============================================================================
# kkfile-build · CNB（cnb.cool）云原生构建流水线（amd64 + arm64）
#
# 架构策略
# --------
#   同一次 push / tag 触发**两条并行流水线**，各自在对应架构的原生 runner 上跑：
#     amd64 -> runner.tags: cnb:arch:amd64
#     arm64 -> runner.tags: cnb:arch:arm64:v8
#
#   为什么不在一条流水线里用 buildx + QEMU 做多架构：
#     * QEMU 下 apt 安装 LibreOffice 要 20~40 分钟，且 dind 里跑
#       docker-container 驱动的多架构 buildx 依赖 privileged/binfmt，稳定性没保证；
#     * 两条原生流水线并行只要 ~10 分钟，且产出的是**原生**镜像。
#
#   注意：runner / docker / services 只能写在流水线级别（stage 级只支持 image），
#         所以这里用 YAML 锚点把同一套 stages 复用到两条流水线上。
#
# 发布分工（避免两条流水线抢同一个 Release）
# ------------------------------------------
#   * 发行包 / Release 附件：只由 amd64 流水线负责（编译产物与架构无关，
#     所以 arm64 流水线不再重复发布 Release）
#   * 镜像：两条流水线各自推本架构镜像 `<版本>-<arch>` / `<tag>-<arch>`，
#     然后各自尝试把两个架构合并成多架构 manifest（谁先看到对方就先合，幂等）；
#     若对方超时未出现，则退化为发布本架构单架构镜像并给出警告。
#
# 场景与版本语义（与 GitHub Actions 保持一致）
# --------------------------------------------
#   * main / master 分支 push -> 主线：构建 KK_VERSION 指定的版本（默认 5.0.2，
#     源码取 tag v5.0.2，保证可复现），滚动发布到 Release tag `latest`
#   * git tag v*             -> 稳定版：从 tag 解析版本，发布到同名 Release（固化）
#
# ⚠️ tag_push 只匹配 glob "v*"，**不要**用兜底符 `$`：
#    滚动发布会创建 latest 这个 git tag，用 `$` 会把 latest 也匹配进来，
#    触发一次多余的完整构建（甚至形成循环）。
# =============================================================================

# ── 构建环境（编译镜像 + Docker-in-Docker，按架构各一份） ──────────────────
# docker.build 让所有 stage 跑在我们自己的编译镜像里（含 Maven + JDK + git），
# 由 CNB 负责构建与缓存；services.docker 注入 dind 与 docker CLI，供推送镜像使用。
# 注意：buildArgs 必须是 docker.build 的子节点（写成 docker 的子节点会被静默忽略）。
.build-env-amd64: &build-env-amd64
  runner:
    tags: cnb:arch:amd64
    cpus: 8
  services:
    - docker
  docker:
    build:
      dockerfile: Dockerfile
      by:
        - Dockerfile
        - build-kkfileview.sh
      buildArgs:
        # 注意用 http：见 Dockerfile.runtime 里关于 ca-certificates 的说明
        APT_MIRROR: http://mirrors.aliyun.com

.build-env-arm64: &build-env-arm64
  runner:
    tags: cnb:arch:arm64:v8
    cpus: 8
  services:
    - docker
  docker:
    build:
      dockerfile: Dockerfile
      by:
        - Dockerfile
        - build-kkfileview.sh
      buildArgs:
        APT_MIRROR: http://mirrors.aliyun.com

# ── 默认版本与架构标记（主线构建用；上游发新版时改 KK_VERSION） ─────────────
# KK_IMAGE_ARCH 用于在共用 stages 里区分架构（决定推哪个 arch tag、
# 以及由哪条流水线负责发布 Release）
.vars-amd64: &vars-amd64
  KK_VERSION: "5.0.2"
  KK_IMAGE_ARCH: "amd64"
  MAVEN_MIRROR: aliyun
  # CNB runner 在国内，Gitee 镜像优先、GitHub 兜底
  KK_REPO_URLS: "https://gitee.com/kekingcn/file-online-preview.git https://github.com/kekingcn/kkFileView.git"

.vars-arm64: &vars-arm64
  KK_VERSION: "5.0.2"
  KK_IMAGE_ARCH: "arm64"
  MAVEN_MIRROR: aliyun
  KK_REPO_URLS: "https://gitee.com/kekingcn/file-online-preview.git https://github.com/kekingcn/kkFileView.git"

# ── 统一阶段（两架构 + 主线/稳定版共用） ───────────────────────────────────
.stages: &stages
  # 判定场景并解析版本，通过 set-output + exports 注入后续 stage
  - name: resolve-scene
    script: |
      set -e
      REF="${CNB_BRANCH:-}"
      if [ "${CNB_IS_TAG:-false}" = "true" ]; then
        case "$REF" in
          v*) VERSION="${REF#v}"; TAG="$REF"; TITLE="kkFileView ${VERSION}"; MK="false"
              echo ">>> 场景: 稳定版（tag=${REF}，版本=${VERSION}）" ;;
          *)  echo "!!! 不支持的 tag 格式: ${REF}（应为 vx.y.z，如 v5.0.2）"; exit 1 ;;
        esac
      else
        VERSION="${KK_VERSION:-5.0.2}"
        TAG="latest"
        TITLE="kkFileView ${VERSION} (latest)"
        MK="true"
        echo ">>> 场景: 主线（分支=${REF}，版本=${VERSION}）"
      fi
      # 源码 ref 固定为 v<版本>：主线也取 tag，保证「同一个版本号永远编译同一份源码」
      echo "##[set-output TAG=${TAG}]"
      echo "##[set-output VERSION=${VERSION}]"
      echo "##[set-output REF=v${VERSION}]"
      echo "##[set-output TITLE=${TITLE}]"
      echo "##[set-output MK=${MK}]"
    exports:
      TAG: RELEASE_TAG
      VERSION: RELEASE_VERSION
      REF: RELEASE_REF
      TITLE: RELEASE_TITLE
      MK: RELEASE_MAKE_LATEST

  # 从源码编译（两条流水线各自编译；产物与架构无关，重复编译换来的是无跨流水线依赖）
  - name: build-kkfileview
    script: |
      set -e
      echo ">>> 本流水线架构: ${KK_IMAGE_ARCH}（$(uname -m)）"
      mkdir -p "$PWD/dist"
      bash /usr/local/bin/build-kkfileview.sh \
        --version "${RELEASE_VERSION}" \
        --ref "${RELEASE_REF}" \
        --maven-mirror "${MAVEN_MIRROR}" \
        --repo-url "${KK_REPO_URLS}" \
        --output "$PWD/dist"

  - name: list-and-check
    script: |
      set -e
      ls -lh "$PWD/dist"
      echo "===== BUILD-INFO.txt ====="
      cat "$PWD/dist/BUILD-INFO.txt" 2>/dev/null || true

  # 打自包含发行包（注入 install.sh / systemd 服务 / 许可证）
  - name: package-dist
    script: |
      set -e
      bash package-dist.sh --dist "$PWD/dist"
      ls -lh "$PWD/dist"

  # ── 以下三个阶段只由 amd64 流水线做：发行包与 Release 附件 ──────────────
  - name: gen-notes
    if: '[ "${KK_IMAGE_ARCH}" = "amd64" ]'
    script: |
      set -e
      cat > RELEASE_NOTES.md <<EOF
      ## ${RELEASE_TITLE}

      kkFileView ${RELEASE_VERSION}，在 CNB 上从源码编译（Maven + Temurin JDK 21，
      源码 tag \`v${RELEASE_VERSION}\`），并打包为**自包含发行包**（内置 install.sh 与 systemd 服务文件）。

      ### 发行包

      | 文件 | 说明 |
      |------|------|
      | \`kkfileview-${RELEASE_VERSION}.tar.gz\` | 解压后 \`sudo ./install.sh --start\` 即可离线安装/原地升级 |
      | \`kkFileView-${RELEASE_VERSION}.jar\` | 原始 Spring Boot fat jar（自行集成用） |
      | \`SHA256SUMS\` | 校验和 |
      | \`BUILD-INFO.txt\` | 版本 / 源码 commit / 工具链 / jar 校验和 |

      ### 容器镜像（CNB 制品库，amd64 + arm64 多架构）

      \`\`\`bash
      docker login docker.cnb.cool -u cnb
      docker pull ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${RELEASE_VERSION}
      docker run -d --name kkfileview -p 8012:8012 ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${RELEASE_TAG}
      # 打开 http://<host>:8012/
      \`\`\`

      镜像 = Ubuntu 24.04 + OpenJDK 21 + LibreOffice（libreoffice-nogui）+ 中文字体
      （文泉驿 / Noto CJK）+ 时区 Asia/Shanghai + locale zh_CN.UTF-8，以非 root 用户运行，
      内置 HEALTHCHECK（\`/actuator/health\`）。

      > arm64 说明：上游 JavaCV 的 ffmpeg/opencv 原生库只有 x86_64 版本，
      > arm64 下视频转码类预览不可用（Office/PDF/图片/CAD 正常）。
      > 镜像由 amd64 与 arm64 两条**原生**流水线各自构建后合并为多架构 manifest。

      ### 运行前置条件（裸机安装）

      * JDK 21 或更高版本
      * LibreOffice：\`apt-get install -y libreoffice-nogui\`
        （kkFileView 的 OfficePluginManager 是 @PostConstruct，**找不到 office.home 会直接启动失败**）

      ### 说明

      本项目仅提供构建与打包流水线，kkFileView 源码版权归上游所有（Apache-2.0），
      发行包内附 \`LICENSE.kkfileview.txt\`。
      EOF
      cat RELEASE_NOTES.md

  # 幂等 + 并发安全地确保 Release 存在
  - name: ensure-release
    if: '[ "${KK_IMAGE_ARCH}" = "amd64" ]'
    script: |
      set -e
      TAG="${RELEASE_TAG:?缺少 RELEASE_TAG}"
      NAME="${RELEASE_TITLE:-$TAG}"
      MK="${RELEASE_MAKE_LATEST:-false}"
      API="https://api.cnb.cool/${CNB_REPO_SLUG}/-/releases"
      H_AUTH="Authorization: Bearer ${CNB_TOKEN}"
      H_ACC="Accept: application/vnd.cnb.api+json"

      # 从 releases 列表里提取指定 tag 的 release id
      # 注意：CNB API 的 GET/POST/PATCH 都必须带 Accept: application/vnd.cnb.api+json，
      #       只带 Content-Type 会返回 406
      rel_id() {
        curl -s -m 30 -H "$H_AUTH" -H "$H_ACC" "${API}" \
          | tr -d ' \t\n' \
          | grep -oE "\"id\":\"[0-9]+\",\"tag_name\":\"$1\"" \
          | head -n 1 | grep -oE '[0-9]+' || true
      }

      BODY=$(sed ':a;N;$!ba;s/\\/\\\\/g;s/"/\\"/g;s/\n/\\n/g' RELEASE_NOTES.md)

      echo ">>> 确保 Release 存在: ${TAG}（make_latest=${MK}）"
      OK="no"
      for attempt in 1 2 3 4 5; do
        ID="$(rel_id "$TAG")"
        if [ -n "$ID" ]; then
          echo ">>> Release 已存在（id=${ID}），更新标题与描述"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -X PATCH \
            -H "$H_AUTH" -H "Content-Type: application/json" -H "$H_ACC" \
            "${API}/${ID}" \
            -d "{\"name\":\"${NAME}\",\"body\":\"${BODY}\",\"make_latest\":\"${MK}\"}") || HTTP="000"
          echo ">>> PATCH 结果: HTTP ${HTTP}"
          OK="yes"
          break
        fi

        echo ">>> 不存在，创建（第 ${attempt} 次尝试）"
        HTTP=$(curl -s -o /tmp/rel.json -w "%{http_code}" -m 30 -X POST \
          -H "$H_AUTH" -H "Content-Type: application/json" -H "$H_ACC" \
          "${API}" \
          -d "{\"tag_name\":\"${TAG}\",\"name\":\"${NAME}\",\"body\":\"${BODY}\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"${MK}\",\"target_commitish\":\"${CNB_COMMIT:-main}\"}") || HTTP="000"
        echo ">>> POST 结果: HTTP ${HTTP}"
        case "$HTTP" in
          200|201) OK="yes"; break ;;
          409|422) echo ">>> 并发创建冲突，视为已存在"; OK="yes"; break ;;
        esac
        head -c 300 /tmp/rel.json 2>/dev/null || true
        echo
        echo ">>> 第 ${attempt} 次失败，3s 后重试"
        sleep 3
      done
      [ "$OK" = "yes" ] || { echo "!!! Release 创建失败（tag=${TAG}）"; exit 1; }
      echo ">>> Release ${TAG} 就绪"

  # 上传发行包为 Release 附件
  - name: upload-attachments
    if: '[ "${KK_IMAGE_ARCH}" = "amd64" ]'
    image: cnbcool/attachments:latest
    settings:
      tag: ${RELEASE_TAG}
      attachments:
        - "./dist/*.tar.gz"
        - "./dist/*.jar"
        - "./dist/SHA256SUMS"
        - "./dist/BUILD-INFO.txt"

  # ── 镜像：各架构原生构建并推送本架构 tag ────────────────────────────────
  # 用 docker:27-cli 作为该 stage 的镜像，确保有 docker CLI；
  # 守护进程由流水线级 services: [docker] 提供，并已自动登录制品库。
  - name: push-image-arch
    image: docker:27-cli
    script: |
      set -e
      REG="${CNB_DOCKER_REGISTRY:-docker.cnb.cool}"
      IMG="${REG}/${CNB_REPO_SLUG_LOWERCASE}"
      ARCH="${KK_IMAGE_ARCH}"
      echo ">>> 推送 ${ARCH} 镜像: ${IMG}（版本 ${RELEASE_VERSION} / tag ${RELEASE_TAG}）"
      echo ">>> 工作目录: $PWD  架构: $(uname -m)"
      test -f Dockerfile.runtime || { echo "!!! 未在当前目录找到 Dockerfile.runtime"; ls -la; exit 1; }
      test -f "dist/kkfileview-${RELEASE_VERSION}.tar.gz" || { echo "!!! 缺少 dist/kkfileview-${RELEASE_VERSION}.tar.gz"; ls -la dist; exit 1; }

      # 显式登录（services: docker 通常已自动登录，这里作为兜底，失败不致命）
      if [ -n "${CNB_TOKEN:-}" ]; then
        echo "${CNB_TOKEN}" | docker login -u "${CNB_TOKEN_USER_NAME:-cnb}" --password-stdin "${REG}" \
          || echo ">>> 警告：docker login 失败，继续尝试推送（可能已自动登录）"
      fi

      docker build \
        -f Dockerfile.runtime \
        --build-arg "KK_VERSION=${RELEASE_VERSION}" \
        -t "${IMG}:${RELEASE_VERSION}-${ARCH}" \
        -t "${IMG}:${RELEASE_TAG}-${ARCH}" \
        .
      docker push "${IMG}:${RELEASE_VERSION}-${ARCH}"
      docker push "${IMG}:${RELEASE_TAG}-${ARCH}"
      echo ">>> ${ARCH} 镜像推送完成"

  # ── 合并多架构 manifest ─────────────────────────────────────────────────
  # 两条流水线都会执行：等待「对方架构」的 tag 出现后合并（先到先合，内容一致，幂等）；
  # 等待超时（对方失败）则退化为发布本架构单架构镜像，不让整条流水线变红。
  - name: merge-manifest
    image: docker:27-cli
    script: |
      set -e
      REG="${CNB_DOCKER_REGISTRY:-docker.cnb.cool}"
      IMG="${REG}/${CNB_REPO_SLUG_LOWERCASE}"
      ARCH="${KK_IMAGE_ARCH}"
      if [ "$ARCH" = "amd64" ]; then OTHER="arm64"; else OTHER="amd64"; fi

      if [ -n "${CNB_TOKEN:-}" ]; then
        echo "${CNB_TOKEN}" | docker login -u "${CNB_TOKEN_USER_NAME:-cnb}" --password-stdin "${REG}" >/dev/null 2>&1 \
          || echo ">>> 警告：docker login 失败"
      fi

      wait_other() {
        local i
        for i in $(seq 1 60); do
          if docker buildx imagetools inspect "${IMG}:${RELEASE_VERSION}-${OTHER}" >/dev/null 2>&1; then
            echo ">>> 已发现 ${OTHER} 架构镜像（第 ${i} 次探测）"
            return 0
          fi
          echo ">>> 等待 ${OTHER} 架构镜像（第 ${i}/60 次，30s 一次）"
          sleep 30
        done
        return 1
      }

      # imagetools create 幂等；两条流水线可能同时合并（内容一致），失败也不算错
      merge() {
        local target="$1" srcs="$2"
        # shellcheck disable=SC2086
        docker buildx imagetools create -t "$target" $srcs \
          || { sleep 5; docker buildx imagetools create -t "$target" $srcs \
               || echo ">>> 警告：$target 合并失败（若对方流水线已合并且内容一致，可忽略）"; }
      }

      if wait_other; then
        echo ">>> 合并多架构 manifest"
        merge "${IMG}:${RELEASE_VERSION}" "${IMG}:${RELEASE_VERSION}-amd64 ${IMG}:${RELEASE_VERSION}-arm64"
        merge "${IMG}:${RELEASE_TAG}" "${IMG}:${RELEASE_TAG}-amd64 ${IMG}:${RELEASE_TAG}-arm64"
        docker buildx imagetools inspect "${IMG}:${RELEASE_VERSION}" || true
      else
        echo ">>> 警告：等待 ${OTHER} 架构超时（该架构流水线可能失败），改为发布单架构镜像（${ARCH}）"
        merge "${IMG}:${RELEASE_VERSION}" "${IMG}:${RELEASE_VERSION}-${ARCH}"
        merge "${IMG}:${RELEASE_TAG}" "${IMG}:${RELEASE_TAG}-${ARCH}"
      fi

  - name: summary
    script: |
      echo "事件        : CNB_IS_TAG=${CNB_IS_TAG:-false} CNB_BRANCH=${CNB_BRANCH}"
      echo "本流水线架构: ${KK_IMAGE_ARCH}（$(uname -m)）"
      echo "kkFileView  : ${RELEASE_VERSION}"
      echo "源码 ref    : ${RELEASE_REF}"
      echo "Release     : ${RELEASE_TAG}"
      ls -lh "$PWD/dist" 2>/dev/null || true

# ── 主线：main / master 分支 push（两架构并行） ───────────────────────────
main:
  push:
    - name: mainline-amd64
      <<: *build-env-amd64
      env:
        <<: *vars-amd64
      stages: *stages
    - name: mainline-arm64
      <<: *build-env-arm64
      env:
        <<: *vars-arm64
      stages: *stages

master:
  push:
    - name: mainline-amd64
      <<: *build-env-amd64
      env:
        <<: *vars-amd64
      stages: *stages
    - name: mainline-arm64
      <<: *build-env-arm64
      env:
        <<: *vars-arm64
      stages: *stages

# ── 稳定版：git tag 推送（glob 匹配 v*，两架构并行） ──────────────────────
"v*":
  tag_push:
    - name: stable-amd64
      <<: *build-env-amd64
      env:
        <<: *vars-amd64
      stages: *stages
    - name: stable-arm64
      <<: *build-env-arm64
      env:
        <<: *vars-arm64
      stages: *stages
