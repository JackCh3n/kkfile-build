# =============================================================================
# docker-compose.yml —— kkFileView 单机部署示例
#
# 用法：
#   # 用本地构建出来的镜像（默认 kkfileview:latest）
#   ./build.sh all && docker compose up -d
#
#   # 用 CI 发布的镜像
#   KK_IMAGE=ghcr.io/jackch3n/kkfile-build:latest docker compose up -d
#   KK_IMAGE=docker.cnb.cool/jackch3n/kkfile-build:latest docker compose up -d
#
# 说明：
#   * 默认镜像名是本项目 `./build.sh all` 构建出的本地镜像 kkfileview:latest；
#     CI 发布的镜像地址如上（镜像名与本仓库同名），需通过 KK_IMAGE 指定
#   * 镜像内已内置 LibreOffice、JDK 21 与中文字体，无需额外安装宿主依赖；
#   * /data 用于存放转换后的文件与本地预览文件，建议挂载持久化卷；
#   * 生产环境请按需在 ./config/application.properties 中配置
#     base.url / trust.host / 水印等参数，并通过只读挂载覆盖容器内配置。
# =============================================================================
name: kkfileview

services:
  kkfileview:
    image: ${KK_IMAGE:-kkfileview:latest}
    container_name: kkfileview
    restart: unless-stopped
    # 若使用 KK_IMAGE 指向远程镜像，compose 会因缺少 build 定义而直接拉取；
    # 需要改端口就设置 KK_PORT
    ports:
      - "${KK_PORT:-8012}:8012"
    environment:
      TZ: Asia/Shanghai
      LANG: zh_CN.UTF-8
      # JVM 参数：内存按实际并发与文档大小调整
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g -Dfile.encoding=UTF-8}
      KK_SERVER_PORT: "8012"
      KK_CONTEXT_PATH: ${KK_CONTEXT_PATH:-/}
      KK_OFFICE_HOME: default
      KK_FILE_DIR: /data/file
      KK_LOCAL_PREVIEW_DIR: /data/preview
      # 需要自定义配置时，取消下面这行注释并使用下面的配置挂载
      # KKFILEVIEW_CONFIG_FILE: /etc/kkfileview/application.properties
    volumes:
      - kkfileview-data:/data
      # 自定义配置（与上面的 KKFILEVIEW_CONFIG_FILE 配合使用）
      # - ./config/application.properties:/etc/kkfileview/application.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8012/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    # LibreOffice 会 fork 子进程，给足停机时间以优雅退出
    stop_grace_period: 90s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  kkfileview-data:
